name: build-shotcut-macos

on:
  workflow_dispatch:
  schedule:
    # daily once — skip if no changes
    - cron: '0 12 * * *'

jobs:
  changes-check:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for changes since last scheduled run
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_SHA=$(gh run list --workflow=${{ github.workflow }} --event=schedule --status=completed --limit=1 --json headSha --jq '.[0].headSha')
          CURRENT_SHA=$(git rev-parse HEAD)
          if [ "$LAST_SHA" = "$CURRENT_SHA" ]; then
            echo "No changes since last scheduled run — skipping"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected — running build"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    runs-on: ubuntu-latest
    needs: changes-check
    if: ${{ needs.changes-check.outputs.has_changes == 'true' && github.repository_owner == 'mltframework' }}
    steps:
      - name: Download from S3
        run: |
          VERSION=$(date +"%y.%-m.%-d")
          echo VERSION=$VERSION
          sudo apt install -yqq s3cmd
          s3cmd --access_key=${{ secrets.AWS_ACCESS_KEY }} --secret_key=${{ secrets.AWS_SECRET_KEY }} --stop-on-error get s3://builds.us.meltytech/shotcut-build-macos.txt.xz
          s3cmd --access_key=${{ secrets.AWS_ACCESS_KEY }} --secret_key=${{ secrets.AWS_SECRET_KEY }} --stop-on-error get s3://builds.us.meltytech/shotcut/shotcut-macos-unsigned-$VERSION.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-dmg
          path: |
            *.dmg

      - name: Dump log
        run: xzcat shotcut-build-macos.txt.xz
