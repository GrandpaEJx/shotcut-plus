name: check-code-format

on:
  workflow_dispatch:
  pull_request:
  schedule:
    # daily once — skip if no changes
    - cron: '0 6 * * *'

jobs:
  changes-check:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for changes since last scheduled run
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_SHA=$(gh run list --workflow=${{ github.workflow }} --event=schedule --status=completed --limit=1 --json headSha --jq '.[0].headSha')
          CURRENT_SHA=$(git rev-parse HEAD)
          if [ "$LAST_SHA" = "$CURRENT_SHA" ]; then
            echo "No changes since last scheduled run — skipping"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected — running check"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  clang-format:
    runs-on: ubuntu-latest
    needs: changes-check
    if: ${{ needs.changes-check.outputs.has_changes == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install clang-format
        run: sudo apt-get install -y clang-format-14

      - name: Check style
        run: |
          FILES=`find . -type f -name "*.h" -o -name "*.c" -o -name "*.cpp"`
          FILTERED_FILES=()
          for file in ${FILES[@]};
          do
            [[ $file =~ "./src/" ]] &&
            [[ ! $file =~ "spatialmedia" ]] &&
            [[ ! $file =~ "defaultlayouts.h" ]] &&
            [[ ! $file =~ "_autogen" ]] &&
            FILTERED_FILES+=($file)
          done
          clang-format-14 --verbose --dry-run --Werror -style=file -i ${FILTERED_FILES[@]}
          if [ $? -eq 0 ]
          then
            echo "SUCCESS: All files are formatted correctly"
            exit 0
          else
          echo "FAILURE: some files are formatted incorrectly"
            exit 99
          fi
