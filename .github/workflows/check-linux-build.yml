name: Check Linux Build

on:
  workflow_dispatch:
  pull_request:
  schedule:
    # daily once — skip if no changes
    - cron: '0 6 * * *'

jobs:
  changes-check:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for changes since last scheduled run
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_SHA=$(gh run list --workflow=${{ github.workflow }} --event=schedule --status=completed --limit=1 --json headSha --jq '.[0].headSha')
          CURRENT_SHA=$(git rev-parse HEAD)
          if [ "$LAST_SHA" = "$CURRENT_SHA" ]; then
            echo "No changes since last scheduled run — skipping"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected — running check"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    runs-on: ubuntu-latest
    needs: changes-check
    if: ${{ needs.changes-check.outputs.has_changes == 'true' }}
    container: debian:unstable

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            libfftw3-dev \
            libmlt-dev \
            libmlt++-dev \
            libx11-dev \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-base-private-dev \
            qt6-charts-dev \
            qt6-declarative-dev \
            qt6-l10n-tools \
            qt6-tools-dev \
            qt6-multimedia-dev \
            qt6-websockets-dev

      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -G Ninja -DCLANG_FORMAT=OFF -DBUILD_DOCS=OFF -B build

      - name: Build
        run: cmake --build build
